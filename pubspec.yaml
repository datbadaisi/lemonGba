name: gba_emulator
description: GPL-3.0 Flutter GBA emulator shell powered by mGBA.
publish_to: "none"
version: 1.0.0+11

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  ffi: ^2.1.4
  file_picker: ^12.3.0
  # Play Billing (also merges BILLING permission into the merged manifest).
  in_app_purchase: ^3.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  hugeicons: ^1.1.7
  archive: ^4.0.9
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
